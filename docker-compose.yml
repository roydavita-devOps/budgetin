name: budgetin

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-budgetin}
      POSTGRES_USER: ${POSTGRES_USER:-budgetin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-budgetin_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-budgetin} -d ${POSTGRES_DB:-budgetin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - budgetin_network

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - budgetin_network

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgres://budgetin:budgetin_password@postgres:5432/budgetin}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      ADMIN_PHONE_NUMBER: ${ADMIN_PHONE_NUMBER:-081390195600}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-budgetin_refresh_token}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BOT_INTERNAL_TOKEN: ${BOT_INTERNAL_TOKEN:-change_me_internal_bot_token}
      OTP_TRUST_PROXY_HOPS: ${OTP_TRUST_PROXY_HOPS:-}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - budgetin_network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:4000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - budgetin_network

  telegram-bot:
    build:
      context: ./telegram-bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BACKEND_URL: ${API_INTERNAL_URL:-http://backend:4000}
      BOT_USER_EMAIL: ${BOT_USER_EMAIL:-telegram@budgetin.local}
      BOT_USER_PASSWORD: ${BOT_USER_PASSWORD:-telegram_password}
      BOT_INTERNAL_TOKEN: ${BOT_INTERNAL_TOKEN:-change_me_internal_bot_token}
      WEB_APP_URL: ${WEB_APP_URL:-https://budgetin.seni.my.id/}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - budgetin_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    networks:
      - budgetin_network

volumes:
  postgres_data:

networks:
  budgetin_network:
    name: budgetin_network
