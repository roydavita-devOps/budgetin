name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend, telegram-bot]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        if: matrix.service == 'frontend'
        run: npm ci
      - name: Install other dependencies
        if: matrix.service != 'frontend'
        run: npm install
      - name: Test backend and Telegram bot
        if: matrix.service != 'frontend'
        run: npm test
      - name: Build frontend
        if: matrix.service == 'frontend'
        run: npm run build
      - name: Test frontend dashboard
        if: matrix.service == 'frontend'
        run: npm test
      - name: Audit frontend dependencies
        if: matrix.service == 'frontend'
        run: npm audit --audit-level=moderate

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Prepare isolated test images
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
      - name: Test transactions against temporary PostgreSQL and Redis
        env:
          INTEGRATION_REQUIRE_PAGINATION: '1'
        run: node backend/test/integration-run.mjs
      - name: Test deletion consistency and calendar validation
        run: node backend/test/qa-p0-sidecar.mjs
      - name: Test inactivity service with temporary PostgreSQL
        run: node backend/test/inactivity-integration.mjs
      - name: Test inactivity API in isolated environment
        run: node backend/test/inactivity-api.test.mjs
